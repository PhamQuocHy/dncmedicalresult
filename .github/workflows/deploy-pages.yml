name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish bản build Next vào nhánh gh-pages (không lấy README từ main).
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false

      # Tránh Pages publish nhánh main (README). Ép source = gh-pages.
      - name: Point Pages source to gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "${BODY}")
          echo "PUT /pages → HTTP ${CODE}"
          cat /tmp/pages.json || true
          if [ "${CODE}" = "404" ]; then
            CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d "${BODY}")
            echo "POST /pages → HTTP ${CODE}"
            cat /tmp/pages.json || true
          fi
